name: Daily News Update

# 毎朝の定期実行は、手元のマシン（Mac mini）の scripts/run_local.sh に移しました。
# （Claude API の料金を節約するため、DGX Spark のローカルLLMで更新しています）
# このワークフローは「手動で回したいとき」用です。
# 使う場合は Secrets に LLM_BASE_URL / LLM_MODEL / LLM_API_KEY を登録してください
# （GitHubから届くOpenAI互換APIのURLが必要です）。
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ddgs
      - name: ニュースを更新
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python update_news.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "🤖 news: $(TZ=Asia/Tokyo date '+%Y.%m.%d') 自動更新"
          git push
